<style>
  :root{
    --bg:#05070d;
    --ink:#f3f7fd;
    --ink-soft:rgba(222,232,246,.9);
    --ink-dim:rgba(201,216,238,.76);
    --ink-faint:rgba(190,206,230,.64);
    --accent:#abdaff;
    --hairline:rgba(162,192,236,.24);
    --hairline-strong:rgba(196,219,255,.5);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); overflow:hidden; }
  body{
    font-family:'Jost',system-ui,-apple-system,sans-serif;
    font-weight:300;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  canvas{ position:fixed; inset:0; display:block; }

  #loader{
    position:fixed; inset:0; z-index:90;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    color:var(--ink-faint);
    font-size:.72rem; font-weight:300;
    letter-spacing:.34em; text-transform:uppercase;
    transition:opacity .8s ease;
  }
  #loader.gone{ opacity:0; pointer-events:none; }

  #intro{
    position:fixed; inset:0; z-index:70;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    background:radial-gradient(125% 95% at 50% 42%, rgba(8,12,22,.30), rgba(5,7,13,.84) 74%);
    transition:opacity 1.25s ease;
  }
  #intro.gone{ opacity:0; pointer-events:none; }
  .intro-inner{ padding:24px; max-width:660px; }

  h1{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:300;
    font-size:clamp(3rem,11vw,6rem);
    line-height:.94;
    letter-spacing:.22em;
    text-indent:.22em;
    margin:0 0 .34em;
    color:#f7fafe;
    text-shadow:0 2px 34px rgba(0,0,0,.6);
    animation:breathe 8s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ opacity:.9; }
    50%{ opacity:1; }
  }
  .sub{
    font-weight:300;
    letter-spacing:.32em;
    text-indent:.32em;
    text-transform:uppercase;
    font-size:clamp(.66rem,1.9vw,.82rem);
    color:var(--ink-soft);
    margin:0 0 3em;
  }

  #enter{
    font-family:'Jost',sans-serif;
    font-weight:400;
    letter-spacing:.26em;
    text-indent:.26em;
    text-transform:uppercase;
    font-size:.76rem;
    color:var(--ink);
    background:rgba(150,200,255,.05);
    border:1px solid var(--hairline-strong);
    border-radius:999px;
    padding:1.05em 2.5em;
    cursor:pointer;
    transition:color .45s ease, border-color .45s ease, box-shadow .6s ease, background .45s ease, transform .45s ease;
  }
  #enter:hover{
    color:#fff;
    background:rgba(150,200,255,.1);
    border-color:rgba(214,232,255,.92);
    transform:translateY(-1px);
  }
  #enter:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; }

  .intro-hint{
    margin:3.2em 0 0;
    font-size:.74rem;
    font-weight:300;
    letter-spacing:.16em;
    color:var(--ink-dim);
  }

  #hud{
    position:fixed; inset:0; z-index:20;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.5s ease;
  }
  #hud.show{ opacity:1; }
  #hud.hidden{ display:none; }

  #hud header{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px;
    padding:clamp(18px,2.8vw,32px) clamp(18px,3vw,40px);
  }
  .brand{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(1.02rem,2.6vw,1.28rem);
    letter-spacing:.42em;
    text-indent:.42em;
    line-height:1.05;
    color:var(--ink);
    text-shadow:0 2px 26px rgba(0,0,0,.65);
  }
  .brand span{
    display:block;
    font-family:'Jost',sans-serif;
    font-size:.64rem;
    font-weight:300;
    letter-spacing:.2em;
    text-indent:.2em;
    color:var(--ink-faint);
    margin-top:.7em;
  }

  .controls{ display:flex; gap:8px; pointer-events:auto; }
  .ctl{
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:.68rem;
    letter-spacing:.14em;
    text-indent:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
    background:rgba(120,160,220,.05);
    border:1px solid var(--hairline);
    border-radius:999px;
    padding:.7em 1.15em;
    cursor:pointer;
    transition:color .35s, border-color .35s, background .35s;
    white-space:nowrap;
  }
  .ctl:hover{ color:#fff; border-color:var(--hairline-strong); background:rgba(150,200,255,.1); }
  .ctl:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .ctl[aria-pressed="true"]{ color:#eaf4ff; border-color:rgba(190,222,255,.72); background:rgba(150,200,255,.16); }

  #copy{
    position:absolute;
    left:0;
    bottom:clamp(96px,15vh,150px);
    max-width:min(470px,80vw);
    padding:1.5em 2.1em 1.5em clamp(20px,3.2vw,44px);
    background:radial-gradient(120% 150% at 0% 100%, rgba(5,7,13,.82), rgba(5,7,13,0) 72%);
    opacity:0;
    transform:translateY(16px);
    transition:opacity 1s ease, transform 1s ease;

  #copy.show{ opacity:1; transform:translateY(0); }
  #copy h2{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:300;
    font-size:clamp(1.9rem,5.2vw,2.7rem);
    line-height:1.04;
    letter-spacing:.05em;
    margin:0 0 .5em;
    color:#f6faff;
    text-shadow:0 2px 34px rgba(0,0,0,.7);
  }
  #copy p{
    font-weight:300;
    font-size:clamp(.92rem,2.5vw,1.02rem);
    line-height:1.7;
    letter-spacing:.005em;
    color:var(--ink-soft);
    margin:0;
    max-width:42ch;
    text-shadow:0 2px 22px rgba(0,0,0,.75);
  }

  #dots{
    position:absolute;
    left:0; right:0;
    bottom:clamp(24px,3.8vh,40px);
    display:flex; align-items:center; justify-content:center;
    gap:clamp(10px,2.2vw,20px);
    pointer-events:auto;
  }
  #track{
    position:absolute;
    top:50%;
    left:0;
    width:0;
    height:1px;
    background:var(--hairline);
  }
  #track i{
    display:block; height:100%; width:100%;
    transform-origin:left center;
    transform:scaleX(0);
    background:linear-gradient(90deg, rgba(150,200,255,.5), var(--accent));
    transition:transform .9s cubic-bezier(.22,.9,.28,1);
  }
  .dot{
    position:relative;
    width:38px; height:34px;
    border:0; background:transparent; padding:0;
    cursor:pointer;
    display:grid; place-items:center;
  }
  .dot:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
  .dot i{
    display:block;
    width:7px; height:7px; border-radius:50%;
    background:rgba(198,216,242,.34);
    transition:background .5s ease, transform .5s ease, box-shadow .5s ease;
  }
  .dot:hover i{ background:rgba(224,238,255,.9); }
  .dot.active i{
    background:#eef6ff;
    transform:scale(1.5);
    outline:1px solid rgba(196,222,255,.55);
    outline-offset:3px;
  }
  .dot span{
    position:absolute; top:-1.7em; left:50%; transform:translateX(-50%);
    font-size:.64rem; letter-spacing:.16em; text-transform:uppercase;
    color:transparent;
    transition:color .35s ease;
    white-space:nowrap;
  }
  .dot:hover span, .dot.active span{ color:var(--ink-soft); }

  .hint2{
    position:absolute; right:clamp(18px,3vw,40px);
    bottom:clamp(26px,4vh,42px);
    font-size:.68rem; letter-spacing:.12em;
    color:var(--ink-faint);
    text-align:right;
    text-shadow:0 2px 18px rgba(0,0,0,.7);
  }

  #hover{
    position:fixed; left:0; top:0; z-index:30;
    transform:translate(-50%,-50%);
    pointer-events:none;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:1.02rem;
    letter-spacing:.3em;
    text-indent:.3em;
    text-transform:uppercase;
    color:#f2f8ff;
    text-shadow:0 2px 18px rgba(0,0,0,.85);
    opacity:0;
    transition:opacity .3s ease;
    white-space:nowrap;
  }
  #hover.show{ opacity:1; }

  @media (max-width:680px){
    .brand span{ display:none; }
    .hint2{ display:none; }
    #copy{ bottom:clamp(88px,16vh,150px); max-width:88vw; padding-left:clamp(18px,5vw,32px); }
    .controls .ctl .full{ display:none; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const NOISE = `
vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
             i.z + vec4(0.0, i1.z, i2.z, 1.0))
           + i.y + vec4(0.0, i1.y, i2.y, 1.0))
           + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
}
`;

const blobVertex = NOISE + `
uniform float uTime;
uniform float uNoiseAmp;
uniform float uNoiseFreq;
varying vec3 vWorldPos;
varying vec3 vNormal;
varying float vDisp;

float displace(vec3 p){
  float n1 = snoise(p * uNoiseFreq + vec3(0.0, 0.0, uTime * 0.12));
  float n2 = snoise(p * uNoiseFreq * 2.3 + vec3(uTime * 0.08, 0.0, 0.0));
  return (n1 * 0.72 + n2 * 0.34) * uNoiseAmp;
}
vec3 orthoT(vec3 n){
  vec3 up = abs(n.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
  return normalize(cross(up, n));
}
void main(){
  vec3 n = normalize(position);
  float d = displace(position);
  vec3 P = position + n * d;
  float eps = 0.18;
  vec3 t = orthoT(n);
  vec3 b = normalize(cross(n, t));
  vec3 q1 = position + t * eps;
  vec3 q2 = position + b * eps;
  vec3 P1 = q1 + normalize(q1) * displace(q1);
  vec3 P2 = q2 + normalize(q2) * displace(q2);
  vec3 nn = normalize(cross(P1 - P, P2 - P));
  vNormal = normalize(mat3(modelMatrix) * nn);
  vec4 wp = modelMatrix * vec4(P, 1.0);
  vWorldPos = wp.xyz;
  vDisp = d;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

const blobFragment = `
uniform vec3 uColorA;
uniform vec3 uColorB;
uniform vec3 uRim;
uniform float uActive;
uniform float uArrival;
varying vec3 vWorldPos;
varying vec3 vNormal;
varying float vDisp;

void main(){
  vec3 viewDir = normalize(cameraPosition - vWorldPos);
  float fres = pow(1.0 - clamp(dot(viewDir, normalize(vNormal)), 0.0, 1.0), 2.1);
  vec3 base = mix(uColorA, uColorB, smoothstep(-1.0, 1.0, vDisp));
  vec3 col = base * (0.16 + fres * 0.8 + uActive * 0.28 + uArrival * 0.5);
  col += uRim * fres * (0.6 + uActive * 0.55);
  float dist = distance(cameraPosition, vWorldPos);
  float depthFade = 1.0 - smoothstep(78.0, 165.0, dist);
  float alpha = (0.14 + fres * 0.95) * depthFade;
  gl_FragColor = vec4(col, alpha);
}
`;

const particleVertex = `
attribute float aSize;
attribute float aPhase;
uniform float uTime;
uniform float uPixelRatio;
uniform float uStretch;
varying float vAlpha;
void main(){
  vec3 p = position;
  p.x += sin(uTime * 0.2 + aPhase) * 0.7;
  p.y += cos(uTime * 0.17 + aPhase * 1.3) * 0.7;
  p.z += sin(uTime * 0.13 + aPhase * 0.7) * 0.7;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = aSize * uPixelRatio * (1.0 + uStretch) * (70.0 / max(-mv.z, 1.0));
  vAlpha = 0.24 + 0.76 * abs(sin(uTime * 0.5 + aPhase));
}
`;

const particleFragment = `
uniform vec3 uColor;
varying float vAlpha;
void main(){
  vec2 c = gl_PointCoord - 0.5;
  float d = length(c);
  float a = smoothstep(0.5, 0.0, d);
  gl_FragColor = vec4(uColor, a * vAlpha * 0.38);
}
`;

const bgVertex = `
varying vec3 vDir;
void main(){
  vDir = normalize(position);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const bgFragment = `
varying vec3 vDir;
void main(){
  float h = normalize(vDir).y;
  vec3 top = vec3(0.010, 0.019, 0.042);
  vec3 mid = vec3(0.024, 0.038, 0.072);
  vec3 bot = vec3(0.005, 0.010, 0.020);
  vec3 col = mix(bot, mid, smoothstep(-1.0, 0.0, h));
  col = mix(col, top, smoothstep(0.0, 1.0, h));
  col += vec3(0.028, 0.017, 0.048) * smoothstep(0.1, 1.0, h);
  gl_FragColor = vec4(col, 1.0);
}
`;

const gradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uResolution: { value: new THREE.Vector2(1, 1) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform vec2 uResolution;
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      vec2 centered = uv - 0.5;
      float r2 = dot(centered, centered);
      float ca = 0.0014 * (0.3 + r2 * 3.0);
      vec3 col;
      col.r = texture2D(tDiffuse, uv + centered * ca).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - centered * ca).b;
      float vig = smoothstep(1.2, 0.24, r2 * 2.0);
      col *= vig;
      float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = max(mix(vec3(luma), col, 1.16), 0.0);
      float grain = fract(sin(dot(uv * uResolution + uTime, vec2(12.9898, 78.233))) * 43758.5453);
      col += (grain - 0.5) * 0.026;
      gl_FragColor = vec4(col, 1.0);
    }
  `
};

const NODES = [
  { name: 'Aurora', color: '#7fd8ff', pos: [-17, 8, -12], r: 2.2, root: 220.0,  text: 'Light remembers the shape of the dark it passed through.' },
  { name: 'Pollen', color: '#c9a7ff', pos: [16, -6, -20], r: 1.9, root: 246.94, text: 'Everything soft travels further than it should.' },
  { name: 'Tide',   color: '#9effd6', pos: [-14, -10, 15], r: 2.0, root: 174.61, text: 'We are mostly water, deciding where to fall.' },
  { name: 'Ember',  color: '#ffd9a0', pos: [20, 9, 8], r: 2.1, root: 196.0,  text: 'A small warmth, kept alive by nothing but attention.' },
  { name: 'Hush',   color: '#ffb3d9', pos: [3, 14, -7], r: 1.8, root: 146.83, text: 'Listen to the space between two thoughts.' },
  { name: 'Bloom',  color: '#a7c4ff', pos: [0, -2, 27], r: 2.6, root: 261.63, text: 'What opens cannot help but be seen.' }
];

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const BASE_DPR = Math.min(window.devicePixelRatio || 1, 1.5);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 2000);
const BASE_FOV = 58;

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.62, 0.68, 0.46);
composer.addPass(bloom);
const fxaa = new ShaderPass(FXAAShader);
composer.addPass(fxaa);
const grade = new ShaderPass(gradeShader);
composer.addPass(grade);

let renderScale = 1;
function applyResolution(){
  const pr = BASE_DPR * renderScale;
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(pr);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth * pr * 0.6, innerHeight * pr * 0.6);
  fxaa.material.uniforms['resolution'].value.set(1 / (innerWidth * pr), 1 / (innerHeight * pr));
  grade.uniforms.uResolution.value.set(innerWidth * pr, innerHeight * pr);
  particles.material.uniforms.uPixelRatio.value = pr;
}

function glowTexture(){
  const s = 128;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(255,255,255,0.5)');
  grd.addColorStop(0.55, 'rgba(255,255,255,0.13)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const GLOW_TEX = glowTexture();

function makeBlob(radius, detail, color, noiseAmp){
  const geo = mergeVertices(new THREE.IcosahedronGeometry(radius, detail));
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uNoiseAmp: { value: noiseAmp },
      uNoiseFreq: { value: 1.7 / radius },
      uColorA: { value: color.clone().multiplyScalar(0.34) },
      uColorB: { value: color.clone().lerp(new THREE.Color(0xffffff), 0.3) },
      uRim: { value: color.clone().lerp(new THREE.Color(0xffffff), 0.5) },
      uActive: { value: 0 },
      uArrival: { value: 0 }
    },
    vertexShader: blobVertex,
    fragmentShader: blobFragment,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.FrontSide
  });
  return new THREE.Mesh(geo, mat);
}

const state = {
  entered: false,
  active: -1,
  hover: -1,

const tour = { on: false, t: 0, interval: 9 };

let audioCtx = null;
let masterGain = null;
let padGain = null;
let padFilter = null;
const padOsc = [];

function initAudio(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t = audioCtx.currentTime;

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);

  const droneFilter = audioCtx.createBiquadFilter();
  droneFilter.type = 'lowpass';
  droneFilter.frequency.value = 520;
  droneFilter.Q.value = 1.4;
  droneFilter.connect(masterGain);

  [55, 82.41, 110.0].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = i === 2 ? 'triangle' : 'sine';
    o.frequency.value = f * (1 + (Math.random() - 0.5) * 0.006);
    const g = audioCtx.createGain();
    g.gain.value = i === 0 ? 0.5 : 0.22;
    o.connect(g);
    g.connect(droneFilter);
    o.start(t + i * 0.4);
  });

  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 0.045;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 210;
  lfo.connect(lfoGain);
  lfoGain.connect(droneFilter.frequency);
  lfo.start();

  padFilter = audioCtx.createBiquadFilter();
  padFilter.type = 'lowpass';
  padFilter.frequency.value = 420;
  padFilter.Q.value = 2.2;
  padFilter.connect(masterGain);

  padGain = audioCtx.createGain();
  padGain.gain.value = 0;
  padGain.connect(padFilter);

  for (let i = 0; i < 3; i++){
    const o = audioCtx.createOscillator();
    o.type = i === 2 ? 'triangle' : 'sine';
    o.frequency.value = 110;
    const g = audioCtx.createGain();
    g.gain.value = i === 0 ? 0.5 : 0.28;
    o.connect(g);
    g.connect(padGain);
    o.start(t + 0.2 + i * 0.25);
    padOsc.push(o);
  }

  masterGain.gain.linearRampToValueAtTime(state.sound ? 0.1 : 0, t + 3.2);
  padGain.gain.setTargetAtTime(0.5, t + 1.2, 1.4);
}

function tunePad(root){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const freqs = [root * 0.5, root, root * 1.5];
  padOsc.forEach((o, i) => o.frequency.setTargetAtTime(freqs[i], t, 0.9));
  padFilter.frequency.setTargetAtTime(620 + root * 1.6, t, 1.2);
}

const CHIME = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25];
function chime(index){
  if (!audioCtx || !state.sound) return;
  const t = audioCtx.currentTime;
  [1, 1.5].forEach((mult, k) => {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = (CHIME[index] || 330) * mult;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(k === 0 ? 0.13 : 0.05, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    o.connect(g);
    g.connect(masterGain);
    o.start(t);
    o.stop(t + 2.7);
  });
}

const intro = document.getElementById('intro');
const hud = document.getElementById('hud');
const loader = document.getElementById('loader');
const copy = document.getElementById('copy');
const copyTitle = document.getElementById('copyTitle');
const copyText = document.getElementById('copyText');
const dotsEl = document.getElementById('dots');
const track = document.getElementById('track');
const trackFill = track.firstElementChild;
const hoverEl = document.getElementById('hover');
const soundBtn = document.getElementById('sound');
const tourBtn = document.getElementById('tour');
const overviewBtn = document.getElementById('overview');

const dots = NODES.map((n, i) => {
  const b = document.createElement('button');
  b.className = 'dot';
  b.setAttribute('aria-label', n.name);
  b.innerHTML = '<i></i><span>' + n.name + '</span>';
  b.addEventListener('click', () => { stopTour(); travelTo(i); });
  dotsEl.appendChild(b);
  return b;
});

function updateDots(){
  dots.forEach((d, i) => {
    const on = i === state.active;
    d.classList.toggle('active', on);
    d.setAttribute('aria-current', on ? 'true' : 'false');
  });
  const wrap = dotsEl.getBoundingClientRect();
  const first = dots[0].getBoundingClientRect();
  const lastDot = dots[dots.length - 1].getBoundingClientRect();
  const left = (first.left + first.width / 2) - wrap.left;
  const right = (lastDot.left + lastDot.width / 2) - wrap.left;
  track.style.left = left + 'px';
  track.style.width = Math.max(0, right - left) + 'px';
  if (state.active >= 0 && !state.overview){
    const r = dots[state.active].getBoundingClientRect();
    const c = (r.left + r.width / 2) - wrap.left;
    const frac = right > left ? (c - left) / (right - left) : 0;
    trackFill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, frac)) + ')';
  } else {
    trackFill.style.transform = 'scaleX(0)';
  }
}

function travelTo(i){
  if (i === state.active) return;
  state.active = i;
  state.overview = false;
  const n = nodeObjects[i];
  focusTarget.copy(n.pos);
  distanceTarget = n.r * 6.2 + 3;
  n.arrival = 1;
  n.ring.material.opacity = 0.5;
  n.ring.scale.setScalar(n.r * 1.2);
  updateDots();
  chime(i);
  tunePad(n.root);
  tour.t = 0;
  copy.classList.remove('show');
  clearTimeout(copy._t);
  copy._t = setTimeout(() => {
    copyTitle.textContent = n.name;
    copyText.textContent = n.text;
    copy.classList.add('show');
  }, 320);
}

function overview(){
  state.overview = true;
  state.active = -1;
  focusTarget.copy(OVERVIEW_FOCUS);
  distanceTarget = 74;
  targetPitch = 0.16;
  updateDots();
  copy.classList.remove('show');
}

function setHover(i){
  if (i === state.hover) return;
  if (state.hover >= 0) nodeObjects[state.hover].hover = false;
  state.hover = i;
  if (i >= 0){
    const n = nodeObjects[i];
    n.hover = true;
    hoverEl.textContent = n.name;
    hoverEl.classList.add('show');
    document.body.style.cursor = 'pointer';
  } else {
    hoverEl.classList.remove('show');
    document.body.style.cursor = '';
  }
}

function updateHoverLabel(){
  if (state.hover < 0) return;
  const n = nodeObjects[state.hover];
  tmpV.copy(n.pos);
  tmpV.y += n.r * 1.5;
  tmpV.project(camera);
  hoverEl.style.left = ((tmpV.x * 0.5 + 0.5) * innerWidth) + 'px';
  hoverEl.style.top = ((-tmpV.y * 0.5 + 0.5) * innerHeight) + 'px';
}

function raycastHover(){
  if (!state.entered || state.dragging || state.overview){ return; }
  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  setHover(hits.length ? hits[0].object.userData.index : -1);
}

function enter(){
  if (state.entered) return;
  state.entered = true;
  initAudio();
  loader.classList.add('gone');
  intro.classList.add('gone');
  hud.classList.remove('hidden');
  requestAnimationFrame(() => hud.classList.add('show'));
  setTimeout(() => { intro.style.display = 'none'; }, 1400);
  state.overview = false;
  travelTo(0);
}

function startTour(){
  tour.on = true;
  tour.t = 0;
  tourBtn.setAttribute('aria-pressed', 'true');
  if (state.overview || state.active < 0) travelTo(0);
}
function stopTour(){
  if (!tour.on) return;
  tour.on = false;
  tourBtn.setAttribute('aria-pressed', 'false');
}

function toggleSound(){
  state.sound = !state.sound;
  soundBtn.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
  soundBtn.textContent = state.sound ? 'Sound' : 'Muted';
  if (masterGain && audioCtx){
    masterGain.gain.linearRampToValueAtTime(state.sound ? 0.1 : 0, audioCtx.currentTime + 1.1);
  }
}

document.getElementById('enter').addEventListener('click', enter);
soundBtn.addEventListener('click', toggleSound);
tourBtn.addEventListener('click', () => { tour.on ? stopTour() : startTour(); });
overviewBtn.addEventListener('click', () => { stopTour(); overview(); });

const canvas = renderer.domElement;

canvas.addEventListener('pointerdown', e => {
  if (!state.entered) return;
  stopTour();
  setHover(-1);
  state.dragging = true;
  state.moved = 0;
  state.lastX = e.clientX;
  state.lastY = e.clientY;
  state.lastInteraction = performance.now();
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  pointerNdc.x = (e.clientX / innerWidth) * 2 - 1;
  pointerNdc.y = -(e.clientY / innerHeight) * 2 + 1;
  if (state.dragging){
    const dx = e.clientX - state.lastX;
    const dy = e.clientY - state.lastY;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    state.moved += Math.abs(dx) + Math.abs(dy);
    targetYaw -= dx * 0.0032;
    targetPitch = Math.max(-1.15, Math.min(1.15, targetPitch + dy * 0.0032));
    state.lastInteraction = performance.now();
  } else {
    raycastHover();
  }
});

canvas.addEventListener('pointerup', e => {
  if (state.dragging && state.moved < 7) raycastHover();
  if (state.dragging && state.moved < 7 && state.hover >= 0) travelTo(state.hover);
  state.dragging = false;
  state.lastInteraction = performance.now();
});

canvas.addEventListener('pointercancel', () => { state.dragging = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  stopTour();
  const base = nodeObjects[state.active] ? nodeObjects[state.active].r : 3;
  distanceTarget = Math.max(base * 3.2, Math.min(base * 12, distanceTarget * (1 + e.deltaY * 0.0009)));
  state.lastInteraction = performance.now();
}, { passive: false });

addEventListener('keydown', e => {
  if (!state.entered) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= NODES.length){ stopTour(); travelTo(num - 1); }
  else if (e.key === 'ArrowRight'){ stopTour(); travelTo((Math.max(-1, state.active) + 1) % NODES.length); }
  else if (e.key === 'ArrowLeft'){ stopTour(); travelTo((state.active <= 0 ? NODES.length : state.active) - 1); }
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 't' || e.key === 'T'){ tour.on ? stopTour() : startTour(); }
  else if (e.key === 'r' || e.key === 'R'){ stopTour(); overview(); }
});

addEventListener('resize', () => { applyResolution(); updateDots(); });

let visible = true;
document.addEventListener('visibilitychange', () => {
  visible = !document.hidden;
  if (visible) last = performance.now();
});

let time = 0;
let last = performance.now();
let qualityAcc = 0;
let qualityFrames = 0;
let qualityTimer = 0;
let goodWindows = 0;
let badWindows = 0;

function animate(now){
  requestAnimationFrame(animate);
  if (!visible) return;

  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);
  time += dt;

  if (state.entered && !state.dragging && !REDUCED && now - state.lastInteraction > 6000){
    targetYaw += dt * 0.05;
  }

  if (tour.on){
    tour.t += dt;
    if (tour.t > tour.interval && state.entered){
      travelTo((state.active + 1) % NODES.length);
      tour.t = 0;
    }
  }

  const kf = 1 - Math.exp(-2.3 * dt);
  focus.lerp(focusTarget, kf);
  distance += (distanceTarget - distance) * (1 - Math.exp(-3.2 * dt));
  yaw += (targetYaw - yaw) * (1 - Math.exp(-4.2 * dt));
  pitch += (targetPitch - pitch) * (1 - Math.exp(-4.2 * dt));

  prevCamPos.copy(camera.position);
  const phi = Math.PI * 0.5 - pitch;
  camOffset.setFromSphericalCoords(distance, phi, yaw);
  camera.position.copy(focus).add(camOffset);
  camera.position.y += Math.sin(time * 0.3) * 0.16;
  camera.lookAt(focus.x, focus.y + 0.2, focus.z);

  camSpeed += ((camera.position.distanceTo(prevCamPos) / Math.max(dt, 0.0001)) - camSpeed) * (1 - Math.exp(-4 * dt));
  const stretch = Math.min(camSpeed * 0.02, 1.1);
  const targetFov = BASE_FOV + Math.min(camSpeed * 0.35, 10);
  camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-3 * dt));
  camera.updateProjectionMatrix();
  particles.material.uniforms.uStretch.value = stretch;

  raycaster.setFromCamera(pointerNdc, camera);
  pointerWorld.copy(raycaster.ray.origin).addScaledVector(raycaster.ray.direction, 16);
  cursorLight.position.lerp(pointerWorld, 1 - Math.exp(-5 * dt));
  cursorLight.material.opacity += ((state.entered && !state.overview ? 0.09 : 0) - cursorLight.material.opacity) * (1 - Math.exp(-3 * dt));

  bg.position.copy(camera.position);
  particles.material.uniforms.uTime.value = time;
  particles.rotation.y = time * 0.008;

  nodeObjects.forEach((n, i) => {
    const glowTarget = (i === state.active) ? 1 : (n.hover ? 0.6 : 0);
    n.glow += (glowTarget - n.glow) * (1 - Math.exp(-3.5 * dt));
    n.arrival *= Math.exp(-dt * 1.5);

    n.mats.forEach(m => {
      m.uniforms.uTime.value = time + i * 3.1;
      m.uniforms.uActive.value = n.glow;
      m.uniforms.uArrival.value = n.arrival;
    });

    const pulse = 1 + Math.sin(time * 0.9 + i) * 0.05;
    n.halo.material.opacity = 0.16 + n.glow * 0.26 + Math.sin(time * 0.6 + i * 2) * 0.02 + n.arrival * 0.14;
    n.halo.scale.setScalar(n.r * (2.8 + n.glow * 1.4 + n.arrival * 0.9) * pulse);
    n.core.material.opacity = 0.3 + n.glow * 0.18 + n.arrival * 0.12;
    n.core.scale.setScalar(n.r * 1.0 * (1 + Math.sin(time * 1.4 + i) * 0.06 + n.arrival * 0.25));

    if (n.arrival > 0.002){
      n.ring.quaternion.copy(camera.quaternion);
      n.ring.material.opacity = n.arrival * 0.4;
      n.ring.scale.setScalar(n.r * (1.2 + (1 - n.arrival) * 4.0));
    } else {
      n.ring.material.opacity = 0;
    }

    tmpV.copy(pointerWorld).sub(n.pos);
    const d2 = tmpV.length();
    const infl = d2 < 16 ? (1 - d2 / 16) : 0;
    const pull = infl * infl * 0.7;
    n.group.position.x = n.pos.x + tmpV.x * pull * 0.11;
    n.group.position.y = n.pos.y + Math.sin(time * 0.35 + i * 1.7) * 0.35 + tmpV.y * pull * 0.11;
    n.group.position.z = n.pos.z + tmpV.z * pull * 0.11;
    n.group.rotation.y += dt * (0.035 + i * 0.004);
  });

  updateHoverLabel();
  grade.uniforms.uTime.value = time;
  composer.render();

  qualityAcc += dt;
  qualityFrames++;
  qualityTimer += dt;
  if (qualityTimer > 1.5){
    const avg = qualityAcc / Math.max(qualityFrames, 1);
    if (avg > 0.022){ badWindows++; goodWindows = 0; }
    else if (avg < 0.0172){ goodWindows++; badWindows = 0; }
    else { goodWindows = 0; badWindows = 0; }

    if (badWindows >= 1 && renderScale > 0.6){
      renderScale = Math.max(0.6, renderScale * 0.85);
      applyResolution();
      badWindows = 0;
    } else if (goodWindows >= 3 && renderScale < 1){
      renderScale = Math.min(1, renderScale / 0.9);
      applyResolution();
      goodWindows = 0;
    }
    qualityTimer = 0;
    qualityAcc = 0;
    qualityFrames = 0;
  }
}

requestAnimationFrame(animate);
setTimeout(() => loader.classList.add('gone'), 350);
</script>
</body>
</html>
